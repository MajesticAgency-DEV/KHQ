    <script>
        (function () {
            function getQueryParam(name) {
                var m = new RegExp('(?:^|&)' + name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '=([^&]*)').exec(window.location.search.substring(1));
                return m && m[1] ? decodeURIComponent(m[1]) : '';
            }

            function setHtml(sel, html) {
                var el = document.querySelector(sel);
                if (el && typeof html === 'string') el.innerHTML = html;
            }

            function setImage(sel, src) {
                var el = document.querySelector(sel);
                if (el && src) { el.setAttribute('src', src); }
            }

            document.addEventListener('DOMContentLoaded', function () {
                var id = getQueryParam('id');
                if (!id) return;

                fetch('/api/Products/GetById/' + encodeURIComponent(id), { method: 'GET' })
                    .then(function (res) { return res.ok ? res.json() : Promise.reject(res); })
                    .then(function (data) {
                        var subProducts = data ? (data.SubProducts || data.subProducts || []) : [];
                        var description = data && (data.Description || data.description) ? (data.Description || data.description) : '';
                        var image = (subProducts.length > 0 && subProducts[0].imageUrl) ? subProducts[0].imageUrl : '';
                        var bgEl = $(".bg-section");
                        // set main product description and cover image
                        setHtml('#description', description);
                        setHtml('#productName', data.name);
                        setHtml('#brandsName', data.brandName);

                        setHtml('#categoryName', data.categoryName);
                        setHtml('#capacity', data.capacity);
                        if (image) {
                            $(".wt-post-media img").attr("src", image);
                            bgEl.css("background-image", "url(" + image + ")");
                        }

                        // target container where you want to insert subproducts
                        var container = $(".owl-carousel.gallery-slider2");
                        container.empty(); // clear old slides

                        // loop over subProducts
                        subProducts.forEach(function (sp, index) {
                            var spImage = sp.imageUrl || sp.ImageUrl || '';
                            var spName = sp.description || sp.Description || 'Untitled';

                            if (index != 0) {
                                var itemHtml = `
                                                <div class="item">
                                                    <div class="project-img-effect-1">
                                                        <img src="${spImage}" alt="${spName}" />
                                                        <div class="wt-info bg-white p-a20">
                                                            <h3 class="wt-tilte m-b10 m-t0"><a href="javascript:;">${spName}</a></h3>
                                                        </div>
                                                    </div>
                                                </div>
`;
                                container.append(itemHtml);
                            }

                        });

                        // reinitialize owl carousel after adding new items
                        if (container.hasClass('owl-loaded')) {
                            container.trigger('destroy.owl.carousel');
                            container.removeClass('owl-loaded');
                            container.find('.owl-stage-outer').children().unwrap();
                        }

                        container.owlCarousel({
                            loop: true,
                            margin: 20,
                            dots: true,
                            items: 3,
                            autoplay: true,
                            autoplayTimeout: 3000,
                            responsive: {
                                0: { items: 1 },
                                600: { items: 2 },
                                1000: { items: 3 }
                            }
                        });
                    })
                    .catch(function (err) {
                        console.error('Error loading product:', err);
                    });
            });
        })();
    </script>
