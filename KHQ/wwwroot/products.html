    <script>
        (function () {
            var $grid = null;
            var currentBrandFilter = '*';
            var currentCategoryFilter = '*';

            function sanitizeToClassName(value) {
                if (!value || typeof value !== 'string') return '';
                // Remove spaces and special characters, keep only alphanumeric and hyphens
                return value.trim().toLowerCase()
                    .replace(/[^\w\s-]/g, '') // Remove special chars except spaces and hyphens
                    .replace(/\s+/g, '-')      // Replace spaces with hyphens
                    .replace(/-+/g, '-')       // Replace multiple hyphens with single hyphen
                    .replace(/^-|-$/g, '');    // Remove leading/trailing hyphens
            }

            function buildFilterItem(className, displayText, id) {
                var safeClass = sanitizeToClassName(className);
                if (!safeClass) return '';
                var idAttr = id ? ' data-id="' + id + '"' : '';
                return '<li' + idAttr + '><a data-filter=".' + safeClass + '" href="#">' + displayText + '</a></li>';
            }

            function buildProductsHtml(item, idx) {
                var id = item && (item.id || item.Id) ? (item.id || item.Id) : '';
                var categoryName = item && (item.CategoryName || item.categoryName) ? (item.CategoryName || item.categoryName) : '';
                var categoryClass = sanitizeToClassName(categoryName);
                var productName = item && (item.Name || item.name) ? (item.Name || item.name) : '';
                var brandName = item && (item.BrandName || item.brandName) ? (item.BrandName || item.brandName) : '';
                var brandClass = sanitizeToClassName(brandName);

                var subProducts = item ? (item.SubProducts || item.subProducts || []) : [];
                var img = (subProducts.length > 0 && subProducts[0].imageUrl) ? subProducts[0].imageUrl : '';
                // Add a light cache-buster so the browser doesn't reuse a stale image on hard refresh
                if (img) {
                    var cacheKey = (item.UpdatedAt || item.updatedAt || id || idx || '').toString();
                    var sep = img.indexOf('?') === -1 ? '?' : '&';
                    img = img + sep + 'v=' + encodeURIComponent(cacheKey);
                }

                return (
                    '<div class="masonry-item ' + categoryClass + ' ' + brandClass + ' col-xl-4 col-lg-4 col-md-6 m-b30"> ' +
                    '<div class="wt-img-effect project-new-2 radius-md shadow">' +
                    '<img src="' + img + '" alt="">' +
                    '<div class="project-new-content">' +
                    '<span class="project-new-category">' + categoryName + '</span>'  +
                    '<div><h3 class="wt-title"><a href="productDetails.html?id=' + encodeURIComponent(id) + '">' + productName + '</a></h3>' + '<span style="float:inline-end; color: #595959;" > ' + item.capacity + '</span >' + '</div>' +
                    
                    '<a href="productDetails.html?id=' + encodeURIComponent(id) + '" class="project-link site-bg-primary"><i class="flaticon-right"></i></a>' +
                    '</div>' +
                    '</div>' +
                    '</div>'
                );
            }

            function initIsotope() {
                var $container = $('#product-list-test');
                if ($container.length && typeof $.fn.isotope !== 'undefined') {
                    // Wait for images to be fully loaded to avoid zero-height items
                    if (typeof $container.imagesLoaded === 'function') {
                        $container.imagesLoaded(function () {
                            $grid = $container.isotope({
                                itemSelector: '.masonry-item',
                                layoutMode: 'fitRows',
                                percentPosition: true
                            });
                        }).always(function () {
                            if ($grid) { $grid.isotope('layout'); }
                        });
                    } else {
                        $grid = $container.isotope({
                            itemSelector: '.masonry-item',
                            layoutMode: 'fitRows',
                            percentPosition: true
                        });
                    }
                }
            }

            function applyFilters() {
                if (!$grid) {
                    initIsotope();
                    if (!$grid) return;
                }

                var filterValue = '*';

                if (currentBrandFilter !== '*' && currentCategoryFilter !== '*') {
                    filterValue = currentBrandFilter + currentCategoryFilter;
                } else if (currentBrandFilter !== '*') {
                    filterValue = currentBrandFilter;
                } else if (currentCategoryFilter !== '*') {
                    filterValue = currentCategoryFilter;
                }

                $grid.isotope({ filter: filterValue });

                // Check if any items are visible after filtering
                setTimeout(function () {
                    var visibleItems = $grid.data('isotope').filteredItems.length;
                    var noResultsMsg = document.getElementById('no-results-message');
                    var productList = document.getElementById('product-list-test');

                    //if (visibleItems === 0) {
                    //    if (noResultsMsg) noResultsMsg.style.display = 'block';
                    //    //if (productList) productList.style.minHeight = '0';
                    //} else {
                    //    if (noResultsMsg) noResultsMsg.style.display = 'none';
                    //    //if (productList) productList.style.minHeight = 'auto';
                    //}
                }, 100);
            }

            function setupFilterListeners() {
                // Brand filter
                $(document).on('click', '#brand-filter a', function (e) {
                    e.preventDefault();
                    if (e.stopPropagation) e.stopPropagation();
                    var $this = $(this);

                    $('#brand-filter li').removeClass('active');
                    $this.parent().addClass('active');

                    currentBrandFilter = $this.attr('data-filter');
                    applyFilters();
                });

                // Category filter
                $(document).on('click', '#category-filter a', function (e) {
                    e.preventDefault();
                    if (e.stopPropagation) e.stopPropagation();
                    var $this = $(this);

                    $('#category-filter li').removeClass('active');
                    $this.parent().addClass('active');

                    currentCategoryFilter = $this.attr('data-filter');
                    applyFilters();
                });
            }

            function loadProductOnce() {
                if (loadProductOnce._called) return;
                loadProductOnce._called = true;

                var qs = new URLSearchParams(window.location.search);
                var categoryId = qs.get('categoryId');
                var brandId = qs.get('brandId');

                var url = "/api/Products/GetAll";
                if (categoryId) {
                    url = "/api/Products/GetByCategory/" + encodeURIComponent(categoryId);
                } else if (brandId) {
                    url = "/api/Products/GetByBrand/" + encodeURIComponent(brandId);
                }

                $.ajax({
                    url: url,
                    method: "GET"
                }).done(function (payload) {
                    try {
                        var cover = document.querySelector('.wt-bnr-inr.overlay-wraper');
                        var coverPhoto = payload.CoverPhoto || payload.coverPhoto;
                        if (cover && coverPhoto) {
                            cover.style.backgroundImage = 'url(' + coverPhoto + ')';
                        }
                    } catch (_er) { }

                    try {
                        var pro = document.querySelector('#product-list-test');
                        var items = Array.isArray(payload) ? payload : (payload.Products || payload.products || []);
                        if (pro && Array.isArray(items)) {
                            pro.innerHTML = items.map(buildProductsHtml).join('');

                            // Initialize Isotope after products are in the DOM and images are loaded
                            var $container = $('#product-list-test');
                            if (typeof $container.imagesLoaded === 'function') {
                                $container.imagesLoaded(function () {
                                    initIsotope();
                                    applyFilters();
                                }).always(function () {
                                    if ($grid) { $grid.isotope('layout'); }
                                });
                            } else {
                                setTimeout(function () {
                                    initIsotope();
                                    applyFilters();
                                }, 100);
                            }
                        }
                    } catch (_err2) { }

                }).fail(function (xhr) {
                    if (window && window.console) {
                        console.warn("Products GetAll request failed", xhr.status);
                    }
                });
            }

            function loadBrandsAndCategories() {
                var brandUl = document.getElementById('brand-filter');
                var categoryUl = document.getElementById('category-filter');
                var qs = new URLSearchParams(window.location.search);
                var categoryIdQS = qs.get('categoryId');
                var brandIdQS = qs.get('brandId');

                // Load Brands
                $.ajax({ url: '/api/Brands/GetAll', method: 'GET' })
                    .done(function (payload) {
                        try {
                            var list = payload.BrandsDtos || payload.brandsDtos || [];
                            if (brandUl && Array.isArray(list)) {
                                var html = '<li class="active"><a data-filter="*" href="#">All Brands</a></li>' +
                                    list.map(function (b) {
                                        var name = b.Name || b.name || '';
                                        var id = b.Id || b.id;
                                        return buildFilterItem(name, name, id);
                                    }).join('');
                                brandUl.innerHTML = html;

                                // Activate brand from query string
                                if (brandIdQS) {
                                    var li = brandUl.querySelector('li[data-id="' + CSS.escape(brandIdQS) + '"]');
                                    if (li) {
                                        brandUl.querySelectorAll('li').forEach(function (n) { n.classList.remove('active'); });
                                        li.classList.add('active');
                                        var a = li.querySelector('a');
                                        if (a) currentBrandFilter = a.getAttribute('data-filter') || '*';
                                    }
                                }
                                if ($grid) applyFilters();
                            }
                        } catch (_e) { }
                    })
                    .fail(function (xhr) {
                        if (console) console.warn('Brands GetAll failed', xhr.status);
                    });

                // Load Categories
                $.ajax({ url: '/api/Category/GetAll', method: 'GET' })
                    .done(function (payload) {
                        try {
                            var list = payload.CategoriesDtos || payload.categoriesDtos || [];
                            if (categoryUl && Array.isArray(list)) {
                                var html = '<li class="active"><a data-filter="*" href="#">All Category</a></li>' +
                                    list.map(function (c) {
                                        var name = (c.Name || c.name || '');
                                        var id = c.Id || c.id;
                                        return buildFilterItem(name, name, id);
                                    }).join('');
                                categoryUl.innerHTML = html;

                                // Activate category from query string
                                if (categoryIdQS) {
                                    var li = categoryUl.querySelector('li[data-id="' + CSS.escape(categoryIdQS) + '"]');
                                    if (li) {
                                        categoryUl.querySelectorAll('li').forEach(function (n) { n.classList.remove('active'); });
                                        li.classList.add('active');
                                        var a = li.querySelector('a');
                                        if (a) currentCategoryFilter = a.getAttribute('data-filter') || '*';
                                    }
                                }
                                if ($grid) applyFilters();
                            }
                        } catch (_e2) { }
                    })
                    .fail(function (xhr) {
                        if (console) console.warn('Category GetAll failed', xhr.status);
                    });
            }

            // Initialize everything when DOM is ready
            function initialize() {
                setupFilterListeners();

                var params = new URLSearchParams(window.location.search);
                var hasCategoryOrBrand = !!(params.get('categoryId') || params.get('brandId'));

                if (hasCategoryOrBrand) {
                    // Hide filter sections when arriving filtered by brand/category
                    try {
                        var brandUl = document.getElementById('brand-filter');
                        if (brandUl && brandUl.parentElement) brandUl.parentElement.style.display = 'none';
                        var categoryUl = document.getElementById('category-filter');
                        if (categoryUl && categoryUl.parentElement) categoryUl.parentElement.style.display = 'none';
                    } catch (_hideErr) { }
                } else {
                    loadBrandsAndCategories();
                }

                loadProductOnce();
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                initialize();
            } else {
                document.addEventListener("DOMContentLoaded", initialize);
            }

            window.addEventListener("load", function () {
                if (!loadProductOnce._called) {
                    initialize();
                }
            });
        })();
    </script>
