    <script>
        (function () {

            function buildProductsHtml(item, idx) {
                var id = item && (item.id || item.Id) ? (item.id || item.Id) : '';
                var categoryName = item && (item.CategoryName || item.categoryName) ? (item.CategoryName || item.categoryName) : '';
                var productName = item && (item.Name || item.name) ? (item.Name || item.name) : '';

                var subProducts = item ? (item.SubProducts || item.subProducts || []) : [];
                var img = (subProducts.length > 0 && subProducts[0].imageUrl) ? subProducts[0].imageUrl : '';

                return (
                    '<div class="masonry-item cat-1 col-xl-4 col-lg-4 col-md-6 m-b30"> ' +
                    '<div class="wt-img-effect project-new-2 radius-md shadow">' +
                    '<img src="' + img +'" alt="">' +
                            '<div class="project-new-content">' +
                    '<span class="project-new-category">' + categoryName +'</span>' +
                    '<h3 class="wt-title"><a href="productDetails.html?id=' + encodeURIComponent(id) + '">' + productName +'</a></h3>' +
                                '<a href="productDetails.html?id=' + encodeURIComponent(id) + '" class="project-link site-bg-primary"><i class="flaticon-right"></i></a>' +
                            '</div>' +
                        '</div>' +
                        '</div>'
                );
            }

            function loadProductOnce() {
                if (loadProductOnce._called) return; loadProductOnce._called = true;
                $.ajax({
                    url: "/api/Products/GetAll",
                    method: "GET"
                }).done(function (payload) {
                    try {
                        var cover = document.querySelector('.wt-bnr-inr.overlay-wraper');
                        var coverPhoto = payload.CoverPhoto || payload.coverPhoto;
                        if (cover && coverPhoto) {
                            cover.style.backgroundImage = 'url(' + coverPhoto + ')';
                        }
                    } catch (_er) { }


                    try {
                        var pro = document.querySelector('#product-list');
                        var items = payload.Products || payload.products || [];
                        if (pro && Array.isArray(items)) {
                            pro.innerHTML = items.map(buildProductsHtml).join('');
                        }
                    } catch (_err2) { }


                }).fail(function (xhr) {
                    if (window && window.console) {
                        console.warn("Products GetAll request failed", xhr.status);
                    }
                });
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                // DOM is ready (or already loaded) — call immediately
                loadProductOnce();
            } else {
                document.addEventListener("DOMContentLoaded", loadProductOnce);
            }
            // Fallback: also call on full load in case DOMContentLoaded was missed
            window.addEventListener("load", loadProductOnce);
        })();
    </script>
