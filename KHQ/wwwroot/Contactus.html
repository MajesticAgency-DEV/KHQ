    <script>
        (function () {
            function loadAboutOnce() {
                if (loadAboutOnce._called) return; loadAboutOnce._called = true;
                $.ajax({
                    url: "/api/ContactUs/GetAll",
                    method: "GET"
                }).done(function (data) {
                    var first = data;

                    var $bgEl = $(".bg-section");

                    var $phoneEl = $(".icon-content .phone-icon-content");
                    var $emailEl = $(".icon-content .email-icon-content");
                    var $locationEl = $(".icon-content .location-icon-content");

                    if (first && typeof first.phoneNumber === "string") {
                        $phoneEl.text(first.phoneNumber);
                    }
                    if (first && typeof first.email === "string") {
                        $emailEl.text(first.email);
                    }
                    if (first && typeof first.companyLocation === "string") {
                        $locationEl.text(first.companyLocation);
                    }
                    if (first && typeof first.coverPhoto === "string" && first.coverPhoto.trim() !== "") {
                        $bgEl.css("background-image", "url(" + first.coverPhoto + ")");
                    }
                }).fail(function (xhr) {
                    if (window && window.console) {
                        console.warn("AboutUs GetAll request failed", xhr.status);
                    }
                });
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                // DOM is ready (or already loaded) — call immediately
                loadAboutOnce();
            } else {
                document.addEventListener("DOMContentLoaded", loadAboutOnce);
            }
            // Fallback: also call on full load in case DOMContentLoaded was missed
            window.addEventListener("load", loadAboutOnce);
        })();
    </script>
	<!-- Generated by Cursor -->
	<script>
		(function () {
			function initContactForm() {
				var form = document.querySelector('.cons-contact-form');
				if (!form) { return; }

				var submitBtn = form.querySelector('button[type="submit"]');
				var showingMsgEl = document.createElement('div');
				showingMsgEl.className = 'mt-3';
				form.appendChild(showingMsgEl);

				function setStatus(message, isError) {
					showingMsgEl.innerHTML = '';
					var alertEl = document.createElement('div');
					alertEl.className = 'alert ' + (isError ? 'alert-danger' : 'alert-success');
					alertEl.textContent = message;
					showingMsgEl.appendChild(alertEl);
				}

				form.addEventListener('submit', function (e) {
					e.preventDefault();

					var name = (form.querySelector('input[name="username"]') || {}).value || '';
					var email = (form.querySelector('input[name="email"]') || {}).value || '';
					var phone = (form.querySelector('input[name="phone"]') || {}).value || '';
					var subject = (form.querySelector('input[name="subject"]') || {}).value || '';
					var message = (form.querySelector('textarea[name="message"]') || {}).value || '';

					if (!name || !email || !phone || !subject || !message) {
						setStatus('Please fill in all required fields.', true);
						return;
					}

					var payload = {
						name: name,
						sentEmail: email,
						subject: subject,
						phone: phone,
						message: message
					};

					if (submitBtn) { submitBtn.disabled = true; }
					setStatus('Sending...', false);

					fetch('/api/Emails/AddEmail', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(payload)
					}).then(function (res) {
						if (!res.ok) { throw new Error('Request failed with status ' + res.status); }
						return res.text();
					}).then(function () {
						setStatus('Thank you! Your message has been sent.', false);
						form.reset();
					}).catch(function (err) {
						setStatus('Sorry, something went wrong. Please try again later.', true);
						if (window && window.console) { console.error(err); }
					}).finally(function () {
						if (submitBtn) { submitBtn.disabled = false; }
					});
				});
			}

			if (document.readyState === 'complete' || document.readyState === 'interactive') {
				initContactForm();
			} else {
				document.addEventListener('DOMContentLoaded', initContactForm);
			}
		})();
	</script>
