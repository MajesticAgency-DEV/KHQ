    <script>
        (function(){
            function getQueryParam(name){
                var m = new RegExp('(?:^|&)' + name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '=([^&]*)').exec(window.location.search.substring(1));
                return m && m[1] ? decodeURIComponent(m[1]) : '';
            }
            function setText(sel, text){
                var el = document.querySelector(sel);
                if(el && typeof text === 'string') el.textContent = text;
            }
            function setHtml(sel, html){
                var el = document.querySelector(sel);
                if(el && typeof html === 'string') el.innerHTML = html;
            }
            function setImage(sel, src){
                var el = document.querySelector(sel);
                if(el && src){ el.setAttribute('src', src); }
            }
            document.addEventListener('DOMContentLoaded', function(){
                var id = getQueryParam('id');
                if(!id){ return; }
                fetch('/api/StainDetails/GetByStainsId/' + encodeURIComponent(id), { method: 'GET' })
                    .then(function(res){ return res.ok ? res.json() : Promise.reject(res); })
                    .then(function(data){
                        var title = data && (data.Title || data.title) ? (data.Title || data.title) : '';
                        var description = data && (data.Description || data.description) ? (data.Description || data.description) : '';
                        var image = data && (data.ImageLink || data.imageLink) ? (data.ImageLink || data.imageLink) : '';
                        var imageCover = data && (data.CoverLink || data.coverLink) ? (data.CoverLink || data.coverLink) : '';

                        var bgEl = $(".bg-section");

                        // Map Title and Description into the page
                        setText('.wt-post-title .post-title', title);
                        setHtml('.wt-post-text p', description);
                        // Optional: set leading image if available
                        setImage('.wt-post-media img', image);
                        // Update banner/breadcrumb labels if desired
                        //setText('.wt-bnr-inr-entry .banner-title-name h2', title || 'Stain Details');
                        setText('.wt-breadcrumb li:last-child', title || 'Stain Details');

                        if (imageCover && typeof imageCover === "string" && imageCover.trim() !== "") {
                            bgEl.css("background-image", "url(" + imageCover + ")");
                        }
                    })
                    .catch(function(_err){ /* ignore or add toast */ });
            });
        })();
    </script>
